bookdown::gitbook:
  includes:
    in_header: [header.html]
  css: style.css
  config:
    toc:
      before: |
        <li><a href="./">Home</a></li>
      after: |
        <li><a href="https://github.com/rstudio/bookdown" target="blank">Published with bookdown</a></li>
    edit: https://github.com/UoMCS/placement-handbook/edit/master/%s
    download: ["pdf", "doc"]
    sharing:
      facebook: false
      github: false
      twitter: false
      linkedin: true
      weibo: false
      instapaper: false
      vk: false
      whatsapp: true
      all: ['facebook', 'linkedin', 'whatsapp', 'github']
    info: true
